name: forgeniq-qa

on:
  pull_request:
  push:
    branches:
      - feature/ri-classification-triage
      - main

jobs:
  release-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Embedded Postgres system libraries
        run: sudo apt-get update && sudo apt-get install -y libreadline-dev zlib1g-dev libicu-dev
      - name: Offline CI gate (no Clerk sessions or staging promotion)
        run: node scripts/qa/orchestrator.mjs --mode=ci
        env:
          CI: 'true'
          FORGENIQ_QA_REQUIRE_DB: '1'
